openapi: 3.0.3

# This file is the contract.
#
# The server's wire types, both SDKs and the reference docs are generated from
# it, which is what keeps them from drifting: a field added here appears
# everywhere, and a field added anywhere else appears nowhere. Hand-editing a
# generated file is therefore always a bug -- change this and regenerate.
#
# The conventions are Stripe's, because they are the ones a developer already
# knows: plural resource nouns, an `object` discriminator on every resource, a
# `list` envelope, errors under a single `error` key, cursor pagination, and
# Idempotency-Key on every unsafe method.
#
# Two deliberate departures, both because Stripe's choice is a legacy artefact
# rather than a good idea:
#
#   Timestamps are RFC 3339 with milliseconds, not Unix seconds. This system
#   meters in milliseconds and routinely runs sandboxes that live for less than
#   a second; Unix-second timestamps would render `created` and `stopped`
#   identical for them, which is not a cosmetic loss.
#
#   IDs are time-sortable (a ULID after the prefix). Stripe's IDs carry no
#   order, so `starting_after` forces the server to look the cursor object up
#   and page relative to it. Sortable IDs make the cursor self-describing, so
#   pagination is exact and stable even while objects are being created.

info:
  title: microvm
  version: "1.0.0"
  description: |
    Every sandbox is a real virtual machine with its own kernel. Code inside one
    is assumed hostile.

    There are two ways to run code, and the difference is the point:

    - **Sandboxes** are held. You create one, run commands in it, and it is
      yours until you stop it or its TTL elapses. Creation fails when the node
      is full, so backpressure is yours to handle.
    - **Tasks** are queued. You hand work to the fleet and it runs when a slot
      frees anywhere. Submission never fails for capacity.

    Use a sandbox for several commands sharing state; use a task for throughput.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:8080/v1
    description: A local daemon. Bound to loopback by default, because this API creates VMs that run arbitrary code.

security:
  - bearerAuth: []

tags:
  - name: Sandboxes
    description: A microVM you hold.
  - name: Executions
    description: A command run inside a sandbox.
  - name: Files
    description: Getting code in and results out.
  - name: Tasks
    description: Work handed to the fleet's queue.
  - name: Images
    description: The language runtimes this node can run.
  - name: Queue
    description: Depth of the queue and this node's slots.

paths:
  /sandboxes:
    post:
      operationId: createSandbox
      summary: Create a sandbox
      description: |
        Boots a microVM and waits for it to answer. Returns once the sandbox is
        ready to run commands.

        Fails with `capacity_error` when the node has no room. That is
        deliberate: a sandbox is a reservation, so the caller is told
        immediately rather than left waiting. If you would rather wait, submit a
        task.

        A `source` seeds the sandbox before this returns, so the first execution
        already has the project. The daemon fetches and expands it host-side and
        writes the result in over the same file endpoints an upload uses; nothing
        in the guest reaches the network to do it, which is why it works with
        `network: false` and why no credential has to be handed to a VM we assume
        is hostile.

        **Seeding is all-or-nothing.** If the fetch, the archive, or any write
        fails, the VM is destroyed and this call fails: no sandbox comes back,
        none is listed, and none is billed. That is create's existing contract --
        it returns a sandbox ready to run commands, or it returns an error -- and
        handing back a half-seeded sandbox in some new state would be a fourth
        outcome for every caller to handle and a new `stop_reason` for three SDKs
        to switch on. Retry with the same `Idempotency-Key`.

        Two codes are specific to seeding:

        - `source_not_permitted` (400, `invalid_request_error`) — the operator has
          not enabled fetching, the host is not on their allowlist, the scheme is
          not `https`, the `credential_ref` names nothing, or the URL resolves
          somewhere the daemon may not go. One code and one message for all of
          them, on purpose: a caller who could tell "no such host" from "that is a
          private address" would have a port scanner with the host's routing table.
        - `source_fetch_failed` (502, `api_error`) — the origin was reached and the
          seed did not survive it: an HTTP error, a timeout, a body past the
          operator's size cap, or an archive holding a member this cannot write.
          An archive whose own members contradict each other -- a file and a
          directory of one name -- is refused here too, rather than becoming a
          failed write.

        Seeding also shares two codes with the rest of the API. `node_at_capacity`
        (429, `capacity_error`) means this node is already fetching as many sources
        at once as it will; retry shortly, as for any other 429. And
        `parameter_invalid` (400) names `ttl_seconds` when the lifetime asked for is
        shorter than the seed took -- seeding does not spend the TTL, so that clock
        starts once the tree is in the guest, but a sandbox cannot be seeded into a
        lifetime that has already elapsed.
      tags: [Sandboxes]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SandboxCreateParams' }
      responses:
        '200':
          description: |
            An existing sandbox, returned by `get_or_create` because one of your
            running sandboxes already has this `name`. Nothing was booted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '201':
          description: The sandbox is running and ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }
        '500': { $ref: '#/components/responses/ApiError' }
        '502': { $ref: '#/components/responses/SourceUnavailable' }

    get:
      operationId: listSandboxes
      summary: List sandboxes
      description: |
        This node's sandboxes, newest first -- yours only. A sandbox belongs to the
        tenant that created it, and a list that reported every tenant's would hand
        out the IDs every other route is reached by. An admin key sees the whole
        node, because it is the operator's own.

        A stopped sandbox stays listed for a retention window and is then
        dropped, so this is not a history: a sandbox that ran an hour ago may no
        longer be here at all. Anything you need to keep -- the final metering
        above all -- comes from the reply to the delete, which is the only place
        it is ever stated.
      tags: [Sandboxes]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
        - name: state
          in: query
          description: Only sandboxes in this state.
          schema: { $ref: '#/components/schemas/SandboxState' }
        - name: tag
          in: query
          description: |
            Only sandboxes carrying this tag, written `key:value`. Repeat the
            parameter to require several: they AND, so `?tag=env:ci&tag=owner:me`
            returns the sandboxes carrying both. The split is at the first colon,
            so a value may contain colons and a key may not.

            The filter is node-local, because the list is: it searches the
            sandboxes this node holds, not the fleet's. On more than one node you
            get this node's answer, and finding a tagged sandbox anywhere means
            asking each node. A tag nobody set is an empty page, not an error --
            there is no registry of known keys to be wrong about.
          explode: true
          schema:
            type: array
            items: { type: string, pattern: '^[^:]+:.*$' }
          example: ["env:ci", "owner:billing-team"]
      responses:
        '200':
          description: A page of sandboxes, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /sandboxes/{sandbox}:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    get:
      operationId: retrieveSandbox
      summary: Retrieve a sandbox
      description: |
        Returns the sandbox with live metering.

        A stopped sandbox is still here for a retention window, so a caller who
        polls learns *why* it stopped -- expired, idle, failed -- rather than
        being handed a bare 404 to interpret. Once the window elapses the record
        is dropped and this returns 404, which is why a 404 on an ID you know
        existed means "too late", not "never was".
      tags: [Sandboxes]
      responses:
        '200':
          description: The sandbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

    delete:
      operationId: deleteSandbox
      summary: Delete a sandbox
      description: |
        Kills the VM and releases everything it held.

        Returns the sandbox with its final metering. Those numbers are sampled
        before the kill and cannot be obtained afterwards: the cgroup that holds
        them dies with the VM, so this reply is the only record of what the
        sandbox cost.
      tags: [Sandboxes]
      responses:
        '200':
          description: The sandbox, stopped, with its final cost.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /sandboxes/{sandbox}/extend:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    post:
      operationId: extendSandbox
      summary: Extend a sandbox's TTL
      description: |
        Pushes the TTL deadline out to `ttl_seconds` from now, for the work that
        turned out longer than the caller guessed at create time. Without it the
        only way to buy time is to create a second sandbox, which does not have
        the first one's state.

        The new deadline is bounded by the host's maximum lifetime measured
        **from creation**, not from now. Extending therefore buys time and can
        never buy immortality: a caller that heartbeats forever still ends up
        with a sandbox that dies, which is the property that keeps a forgotten
        loop from pinning a slot for a week.

        Asking past that bound is a `400`, naming how many seconds are left,
        rather than a silent trim to the maximum. A caller told `200` for an hour
        they did not get plans for an hour and finds out when their work is
        killed halfway; an error arrives while they can still act on it. Read
        `expires` off the reply all the same -- that field is the deadline.

        It never brings a deadline forward. The deadline becomes the later of
        what it already was and `now + ttl_seconds`, because two callers
        heartbeating the same sandbox at different intervals would otherwise have
        the shorter one cut the longer one short. That also makes a retry
        harmless, which is why this route takes no Idempotency-Key.

        Extending a stopped sandbox is a `409`: there is no deadline left to
        move, and a caller heartbeating something already gone should learn it
        here rather than from the next exec.

        The idle timeout is untouched. A long TTL does not keep an idle sandbox
        alive; nothing except running something does.
      tags: [Sandboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SandboxExtendParams' }
      responses:
        '200':
          description: The sandbox, with its new `expires`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /sandboxes/{sandbox}/suspend:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    post:
      operationId: suspendSandbox
      summary: Suspend a sandbox
      description: |
        Snapshot the sandbox's VM to disk and tear the VM down, leaving the
        sandbox resumable under the same id with `POST
        /sandboxes/{sandbox}/resume`. It is the durable half of resume-after-stop:
        a suspended sandbox costs no CPU or memory, only the snapshot on disk.

        Its slot and name are kept, not released, so a later resume is guaranteed
        both and cannot be refused for either. It is not swept like a stopped
        sandbox — it is kept until you resume or delete it.

        An execution in flight is a `409`: freezing the VM would capture the
        process mid-run. Finish or cancel it, then suspend. A node not configured
        for snapshots answers `409` too.
      tags: [Sandboxes]
      responses:
        '200':
          description: The sandbox, now `suspended`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /sandboxes/{sandbox}/resume:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    post:
      operationId: resumeSandbox
      summary: Resume a suspended sandbox
      description: |
        Boot a fresh VM from a suspended sandbox's snapshot and return it running
        under the same id. The clock restarts: a resumed VM is a new VM with a
        fresh TTL window.

        Only a `suspended` sandbox can be resumed; a running or stopped one is a
        `409`. Because the suspend kept the slot and name, this neither reserves
        nor can be refused for either.
      tags: [Sandboxes]
      responses:
        '200':
          description: The sandbox, now `running` again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /sandboxes/{sandbox}/executions:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    post:
      operationId: createExecution
      summary: Run a command
      description: |
        Starts a command and returns immediately with the execution. It does not
        wait for the command to finish.

        To follow the output, stream the execution; to collect it afterwards,
        retrieve it. Output is buffered on the host either way, so nothing is
        lost between starting the command and connecting to its stream.
      tags: [Executions]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionCreateParams' }
      responses:
        '201':
          description: The command is running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

    get:
      operationId: listExecutions
      summary: List a sandbox's executions
      tags: [Executions]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
      responses:
        '200':
          description: A page of executions, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /sandboxes/{sandbox}/executions/{execution}:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      operationId: retrieveExecution
      summary: Retrieve an execution
      description: |
        Returns the execution and everything it printed.

        This works after the sandbox is gone. Output is buffered on the host
        precisely because the moment you most need it -- a timeout, a TTL, the
        OOM killer -- is the moment a guest-side buffer would die with the VM.
      tags: [Executions]
      responses:
        '200':
          description: The execution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /sandboxes/{sandbox}/executions/{execution}/stream:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      operationId: streamExecution
      summary: Stream an execution's output
      description: |
        Server-sent events, one per output chunk, as the process produces them.
        The stream ends with an `exit` or `error` event.

        The stream replays from the start of the execution, so connecting late
        loses nothing and a dropped connection can simply reconnect. This is why
        starting a command and streaming it are separate calls: a single call
        that did both would make the output unrecoverable the moment the
        connection broke.

        SSE rather than WebSockets because the traffic is one-directional: there
        is no upgrade, no ping/pong, and it survives any proxy that speaks HTTP.
      tags: [Executions]
      responses:
        '200':
          description: A stream of frames.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/Frame' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /sandboxes/{sandbox}/executions/{execution}/cancel:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
      - $ref: '#/components/parameters/ExecutionId'
    post:
      operationId: cancelExecution
      summary: Cancel an execution
      description: |
        Signals the process. The signal reaches the whole process group, so a
        program that spawned children does not leave them running.

        Defaults to SIGKILL. Hostile code is not owed a chance to clean up, and
        a graceful signal it can ignore is a way to outlive its own cancel.
      tags: [Executions]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionCancelParams' }
      responses:
        '200':
          description: The execution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /sandboxes/{sandbox}/executions/{execution}/resize:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
      - $ref: '#/components/parameters/ExecutionId'
    post:
      operationId: resizeExecution
      summary: Resize a TTY execution's window
      description: |
        Tell a `tty` execution its terminal changed size. The guest raises
        SIGWINCH, so a full-screen program repaints to the new dimensions —
        wire it to your own terminal's resize event to keep the two in step.

        Only for executions started with `tty: true`; a plain execution has no
        terminal to resize and is answered with a 409.
      tags: [Executions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionResizeParams' }
      responses:
        '204': { description: The window was resized. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /sandboxes/{sandbox}/files:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    post:
      operationId: createFile
      summary: Upload a file
      description: Writes a file into the sandbox, creating parent directories.
      tags: [Files]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileCreateParams' }
      responses:
        '201':
          description: The file was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

    get:
      operationId: retrieveFile
      summary: Download a file
      description: |
        The path is a query parameter rather than part of the route because a
        file path contains slashes, and encoding them into a path segment would
        make every caller escape their own paths to name a file.
      tags: [Files]
      parameters:
        - name: path
          in: query
          required: true
          description: Absolute path inside the sandbox.
          schema: { type: string, example: "/app/out.json" }
      responses:
        '200':
          description: The file's contents.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /sandboxes/{sandbox}/files/batch:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    post:
      operationId: createFiles
      summary: Upload several files
      description: |
        Writes a set of files in one request, in the order given, creating parent
        directories.

        Each path is named at most once. Two entries for one path would report two
        sizes for one file and leave only the later on disk, which makes the reply
        a statement about nothing, so the batch is refused rather than resolved
        last-wins.

        One round trip instead of N. A project is rarely a single file, and
        twenty uploads spend twenty HTTP requests and twenty vsock round trips on
        work the guest can do in one.

        Validation is all-or-nothing: every entry is checked -- path, mode, size
        -- before a single byte enters the sandbox, so a batch with one bad path
        writes nothing at all rather than half a project. Writing is not
        transactional and cannot be: once the third file is on the guest's disk
        there is no unwriting it. A write that fails partway therefore fails the
        request with the files before it already written, and the order is the
        order you gave precisely so a caller can say which those were.

        The batch is one request body, so it is bound by the daemon's body cap
        for all of the files together -- and base64 makes the payload a third
        larger than the bytes it carries.
      tags: [Files]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileBatchCreateParams' }
      responses:
        '201':
          description: |
            Every file was written, in the order given. A list envelope for
            consistency with every other collection, not because it pages:
            `has_more` is always false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileList' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /sandboxes/{sandbox}/dirs:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    post:
      operationId: createDir
      summary: Create a directory
      description: |
        Creates a directory and any parents it needs.

        Uploading a file already creates its parents, so this route is for the
        directory that stays empty: an output directory a command writes into, a
        mount point, a layout a build tool expects to exist before it starts.

        Existing is success, not conflict -- `mkdir -p` semantics are what a
        caller building a tree wants, and they make a retry safe. An existing
        *file* at the path is a conflict, because that is a caller confusing two
        different things rather than repeating themselves.

        The directory is created `0755`, and so is every parent. There is no
        `mode` knob: a directory without its execute bit cannot be entered, so
        most of what one could ask for here is a way to create something
        unusable.
      tags: [Files]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DirectoryCreateParams' }
      responses:
        '201':
          description: The directory exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Directory' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /tasks:
    post:
      operationId: createTask
      summary: Submit a task
      description: |
        Queues work for the fleet. Unlike creating a sandbox, this never fails
        for capacity: the task waits for a slot on any node.

        The queue is the source of truth. No node is told what to run; each
        pulls when it has a free slot, which is why adding the three-hundredth
        node needs no coordination and losing one needs no detection.
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateParams' }
      responses:
        '202':
          description: The task is queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }
        '503': { $ref: '#/components/responses/QueueUnreachable' }

  /tasks/{task}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      operationId: retrieveTask
      summary: Retrieve a task
      tags: [Tasks]
      responses:
        '200':
          description: The task, with its result once it has one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }
        '503': { $ref: '#/components/responses/QueueUnreachable' }

  /queue:
    get:
      operationId: retrieveQueue
      summary: Retrieve the queue
      description: |
        The queue's depth, plus this node's slots.

        `pending`, `leased`, `done` and `failed` describe the whole fleet's
        queue. `slots` and `busy` describe *this node only*: no node knows the
        fleet's capacity, and none needs to, which is exactly what lets a node
        be added without telling anything else it exists.
      tags: [Queue]
      responses:
        '200':
          description: The queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }
        '503': { $ref: '#/components/responses/QueueUnreachable' }

  /images:
    get:
      operationId: listImages
      summary: List images
      description: The language runtimes this node can boot.
      tags: [Images]
      responses:
        '200':
          description: The images.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /tenants:
    get:
      operationId: listTenants
      summary: List tenant policies
      description: |
        Every tenant with a storage policy set. **Admin only.** A tenant with no
        policy is unlimited and does not appear here.
      tags: [Tenants]
      responses:
        '200':
          description: The configured tenants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /tenants/{tenant}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string }
        description: The tenant namespace, e.g. from a sandbox's `storage.namespace`.
    put:
      operationId: updateTenant
      summary: Set a tenant's storage policy
      description: |
        Set the storage cap and full-policy for a tenant. **Admin only.** This is
        the one thing an admin key can do that a normal key cannot, and it is
        powerful: `evict` deletes a tenant's oldest data to make room, so setting
        it is a decision to allow that deletion.
      tags: [Tenants]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantUpdateParams' }
      responses:
        '200':
          description: The updated tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }
    get:
      operationId: retrieveTenant
      summary: Retrieve a tenant's policy and usage
      description: |
        A tenant's cap, policy, and how much of the cap is used right now.
        **Admin only.** The usage is read from the object store, so it is the
        real total, not an estimate.
      tags: [Tenants]
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/CapacityExhausted' }

  /health:
    get:
      operationId: retrieveHealth
      summary: Health check
      description: Liveness. The one route that needs no credentials.
      tags: [Queue]
      security: []
      responses:
        '200':
          description: The daemon is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <token>`. Tokens are compared in constant time.

  parameters:
    SandboxId:
      name: sandbox
      in: path
      required: true
      description: |
        A sandbox belongs to the tenant whose token created it, and every route
        below resolves it against the caller: another tenant's sandbox is a `404`,
        not a `403`. An ID is not a capability, and a `403` would confirm which of a
        guessed range exist. So a `404` here means one of three things -- never
        existed, already forgotten, or not yours -- and the API will not say which.
      schema: { type: string, pattern: '^sb_[0-9A-HJKMNP-TV-Z]{26}$', example: "sb_01JZ8QK3M4N5P6R7S8T9V0W1X2" }

    ExecutionId:
      name: execution
      in: path
      required: true
      schema: { type: string, pattern: '^exe_[0-9A-HJKMNP-TV-Z]{26}$', example: "exe_01JZ8QK3M4N5P6R7S8T9V0W1X2" }

    TaskId:
      name: task
      in: path
      required: true
      schema: { type: string, pattern: '^tsk_[0-9A-HJKMNP-TV-Z]{26}$', example: "tsk_01JZ8QK3M4N5P6R7S8T9V0W1X2" }

    Limit:
      name: limit
      in: query
      description: How many objects to return, 1–100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }

    StartingAfter:
      name: starting_after
      in: query
      description: |
        A cursor. Returns the page of objects immediately after this ID, which
        is the ID of the last object on the previous page.
      schema: { type: string }

    EndingBefore:
      name: ending_before
      in: query
      description: |
        A cursor, for paging backwards. Returns the page immediately before this
        ID, which is the ID of the first object on the current page.
      schema: { type: string }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Makes a retry safe. A request that never got its reply -- a timeout, a
        dropped connection -- cannot be known to have failed, so the only sane
        move is to retry it; without a key, that retry runs the work twice.

        The first request with a given key is executed and its reply recorded.
        Any later request with the same key replays that reply, without doing
        the work again. Keys are held for 24 hours and are scoped to the token.

        Reusing a key with a *different* request body is an `idempotency_error`:
        it means the client believes it is retrying something it is not.
      schema: { type: string, maxLength: 255, example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890" }

  responses:
    InvalidRequest:
      description: The request is malformed or contradicts itself.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: The token is missing or wrong.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: |
        The token is valid but lacks the power for this. Distinct from 401 on
        purpose: 401 means "log in", 403 means "you are logged in and still may
        not". Setting a tenant policy needs an admin key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: No such object.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: The object already exists, or is in a state that forbids this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    CapacityExhausted:
      description: |
        No room right now. Either the node has no free slot, or the caller is over
        a per-tenant limit -- both are `capacity_error` with code
        `node_at_capacity`, deliberately, because the caller's move is the same and
        that is the pair every SDK already backs off on. The message is what tells
        them apart: a full node frees up on its own, whereas being over your own
        sandbox cap needs you to delete one.
      headers:
        Retry-After:
          description: |
            Seconds to wait, on the refusals whose end can be named to the second --
            the request-rate limit. Absent for a full node and for the per-tenant
            sandbox cap: when a slot frees is not something this node knows, and a
            number invented here would be a guess dressed as a fact.
          required: false
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    QueueUnreachable:
      description: |
        The queue could not be reached, so nothing is known about the task. This
        is deliberately not a 404: "we cannot ask" and "it does not exist" call
        for opposite reactions from a client, and reporting the first as the
        second would have a caller give up on work that is running fine.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ApiError:
      description: Something failed on our side.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    SourceUnavailable:
      description: |
        A sandbox's `source` was reachable and still could not be used: the origin
        returned an error, took too long, sent more bytes than the operator allows,
        or the archive holds a member that cannot be written into a guest.

        An `api_error` rather than an `invalid_request_error`, because the caller's
        move is the one an `api_error` already tells them: the URL is not
        necessarily wrong, and the origin may answer in a minute. A URL that is
        refused outright is a 400 instead, and never reaches the origin at all.

        The sandbox does not exist. Seeding is all-or-nothing, so the VM was
        destroyed before this reply.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    # --- errors -------------------------------------------------------------

    ErrorEnvelope:
      type: object
      description: The body of every non-2xx reply.
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }

    Error:
      type: object
      required: [type, code, message]
      properties:
        type:
          $ref: '#/components/schemas/ErrorType'
        code:
          type: string
          description: |
            A stable, machine-readable identifier. Switch on this. The message is
            for humans and may be reworded at any time.
          example: "sandbox_not_found"
        message:
          type: string
          description: A human-readable explanation. Never parse it.
          example: "No such sandbox: sb_01JZ8QK3M4N5P6R7S8T9V0W1X2"
        param:
          type: string
          description: Which request field was at fault, when one was.
          example: "image"
        request_id:
          type: string
          description: Quote this when reporting a problem.

    ErrorType:
      type: string
      description: |
        The class of error, which determines what a client should *do*:

        - `invalid_request_error` — the request is wrong. Retrying it unchanged
          will fail identically.
        - `authentication_error` — the token is missing or wrong.
        - `capacity_error` — no room right now. Retrying later may work; a task
          would not have failed at all.
        - `idempotency_error` — an Idempotency-Key was reused with a different
          body.
        - `api_error` — our fault. Safe to retry with the same Idempotency-Key.
      enum:
        - invalid_request_error
        - authentication_error
        - capacity_error
        - idempotency_error
        - api_error

    # --- pagination ---------------------------------------------------------

    ListEnvelope:
      type: object
      required: [object, url, has_more, data]
      properties:
        object: { type: string, enum: [list] }
        url:
          type: string
          description: The endpoint this list came from.
        has_more:
          type: boolean
          description: |
            Whether more objects exist past this page. Page on with
            `starting_after` set to the last ID in `data`.
        data:
          type: array
          items:
            type: object

    # --- sandbox ------------------------------------------------------------

    SandboxState:
      type: string
      description: |
        - `running` — has a live VM.
        - `stopped` — gone for good; kept only briefly for its final metering.
        - `suspended` — snapshotted to disk and torn down, resumable under the
          same id with `POST /sandboxes/{sandbox}/resume`. Costs no CPU or memory,
          only the snapshot, and keeps its slot and name so a resume cannot be
          refused for either.
      enum: [running, stopped, suspended]

    SandboxStopReason:
      type: string
      description: |
        Why a sandbox has no running VM. `stopped` means you asked; `suspended`
        means it was snapshotted for later; the rest happened to it, and only
        `failed` means something went wrong.
      enum:
        - stopped     # deleted by the caller
        - expired     # its TTL elapsed
        - idle        # nothing ran for its idle timeout
        - failed      # the VM died
        - suspended   # snapshotted and torn down, resumable

    Sandbox:
      type: object
      required: [id, object, image, state, created, expires, stats]
      properties:
        id: { type: string, example: "sb_01JZ8QK3M4N5P6R7S8T9V0W1X2" }
        object: { type: string, enum: [sandbox] }
        image: { type: string, example: "python" }
        name:
          type: string
          description: |
            The handle this sandbox was created with, if any. It is unique among
            your running sandboxes and is what `get_or_create` resolves, so you
            can address "the sandbox called build" without storing its id.

            It frees the moment the sandbox stops: create the next `build` and it
            is a fresh VM. Absent when the sandbox was created without one.
          example: "build"
        state: { $ref: '#/components/schemas/SandboxState' }
        stop_reason:
          allOf: [{ $ref: '#/components/schemas/SandboxStopReason' }]
          description: Set once the sandbox is stopped.
        created: { type: string, format: date-time }
        expires:
          type: string
          format: date-time
          description: |
            When the TTL kills it, whatever it is doing. Movable with
            `POST /sandboxes/{sandbox}/extend`, but only up to the host's maximum
            lifetime counted from `created`, so this field can be pushed back and
            never removed.
        stopped: { type: string, nullable: true, format: date-time }
        vcpus: { type: integer }
        mem_mib: { type: integer }
        network:
          type: boolean
          description: Whether filtered egress is on.
        tags:
          type: object
          additionalProperties: { type: string }
          description: |
            The labels set at create time, returned exactly as they were given.

            Unlike `env`, tags **are** returned -- here, and in every list that
            includes this sandbox. Never put a credential in one. A secret that
            needs to reach the guest is what `env` is for, and `env` is
            write-only precisely so this mistake cannot be made by accident.
          example: {"env": "ci", "owner": "billing-team"}
        storage:
          allOf: [{ $ref: '#/components/schemas/SandboxStorage' }]
          description: |
            Where this sandbox's files persist, when the node has object storage
            configured. Absent when it does not.
        source:
          allOf: [{ $ref: '#/components/schemas/SandboxSource' }]
          description: |
            What this sandbox was seeded from, when it was seeded at all. Absent
            otherwise -- a sandbox with no `source` has no empty source object.

            Never the URL as it was sent. See `url_redacted`.
        stats: { $ref: '#/components/schemas/Stats' }

    SandboxStorage:
      type: object
      description: |
        A sandbox's view of object storage. Files written here outlive the
        sandbox and are reachable by every sandbox in the same `namespace`, which
        is how state is carried from one run to the next.
      required: [namespace, read_only]
      properties:
        namespace:
          type: string
          description: |
            The tenant your files live under, derived from your API key. It is
            yours and stable: write a file today, read it from another sandbox
            tomorrow. You cannot choose it — that is what stops one tenant from
            naming another's.
          example: "t_9f86d081884c7d659a2feaa0c55ad015"
        read_only:
          type: boolean
          description: Whether this sandbox may write, or only read.
        mount_path:
          type: string
          description: |
            Where storage is mounted inside the guest, e.g. `/mnt/storage`. This
            is a directory in your own sandbox, not a namespace, so choosing it
            reaches nobody else's files. Defaults to `/mnt/storage`.
          example: "/mnt/storage"
        max_bytes:
          type: integer
          format: int64
          description: |
            Your tenant's total storage cap in bytes, or 0 for unlimited. This is
            the limit your writes are measured against; it is set by an admin.
        policy:
          allOf: [{ $ref: '#/components/schemas/TenantFullPolicy' }]
          description: What a write does when the cap is reached. Absent when there is no cap.

    SandboxSource:
      type: object
      description: |
        Where a sandbox was seeded from. Reported so that a sandbox found later can
        be traced back to the code in it, which is otherwise unknowable from
        outside the guest.
      required: [type, url_redacted]
      properties:
        type:
          type: string
          enum: [tarball, git]
        url_redacted:
          type: string
          description: |
            The scheme, host and path of what was fetched. Userinfo, query and
            fragment are cut off, and the field says so in its name so that nobody
            passes it to a fetcher expecting it to work.

            Cut down because a URL is routinely a credential: a presigned object
            URL carries its signature in the query, and `https://user:token@host/`
            carries a token in plain sight. Tags taught this -- everything the API
            returns is readable by the tenant and by an admin key, so nothing the
            API returns may be a secret. A URL is the first field where that rule
            is not obvious, which is exactly why it is applied here.
          example: "https://github.com/acme/widgets/archive/refs/tags/v1.2.3.tar.gz"
        ref:
          type: string
          description: The git ref that was asked for. Absent for a tarball.
          example: "main"
        commit:
          type: string
          description: |
            The commit that was actually checked out, resolved. A branch names a
            moving target and a tag can be moved under you; this is the only field
            here that says the same thing tomorrow. Absent for a tarball.
          example: "9f2b1c4e7a3d5f8091b2c3d4e5f60718293a4b5c"
        credential_ref:
          type: string
          description: |
            The operator credential that was used, by name. Safe to return because
            it was never the secret -- it is the name of one.
          example: "github-ci"

    SandboxList:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Sandbox' }

    Stats:
      type: object
      description: |
        What a sandbox has consumed. Cumulative since boot, so a biller must
        diff two samples: booting alone costs a couple of CPU-seconds, and
        cumulative idle is meaningless for a sandbox's first seconds.
      required: [active_cpu_ms, wall_ms, idle_ms, memory_current_bytes, memory_peak_bytes]
      properties:
        active_cpu_ms:
          type: integer
          description: |
            CPU actually burned. **This is the billable number.** A sandbox
            blocked on I/O bills nearly nothing: three seconds asleep costs
            about 15ms of this.
        wall_ms:
          type: integer
          description: How long the sandbox has existed.
        idle_ms:
          type: integer
          description: |
            `wall_ms` minus `active_cpu_ms`: existing but doing nothing. Zero
            when a multi-vCPU sandbox burns more CPU than wall-clock.
        memory_current_bytes: { type: integer }
        memory_peak_bytes:
          type: integer
          description: The high-water mark, which is what a memory limit must be sized against.
        network_rx_bytes:
          type: integer
          format: int64
          description: |
            Bytes the guest received.

            Read from the host's TAP device, where the direction necessarily
            inverts: what the guest sends is what the host receives. Both network
            fields are named from the **guest's** point of view, so `rx` is what
            came into the sandbox and `tx` is what it sent out. Do not line them
            up with host-side counters of the same name -- those are the other way
            round, and the mistake is invisible until an egress bill or an abuse
            report says otherwise.

            Absent when the sandbox has no network device: with `network: false`
            there is no TAP, and "nothing to count" is not the same claim as
            zero bytes.
        network_tx_bytes:
          type: integer
          format: int64
          description: |
            Bytes the guest sent. This is the egress number -- the one a bandwidth
            cap limits and an abuse complaint is about. Counted at the host's TAP
            and named from the guest's side, like `network_rx_bytes`.

    SandboxCreateParams:
      type: object
      required: [image]
      properties:
        image:
          type: string
          description: The language image.
          example: "python"
        name:
          type: string
          maxLength: 64
          description: |
            A stable handle for this sandbox, unique among your running
            sandboxes. Letters, digits and `_-.`, at most 64 bytes.

            On its own it just labels the sandbox and makes a duplicate name a
            409. With `get_or_create` it becomes a lookup: the same name returns
            the sandbox you already have rather than booting a second one, so a
            stable identity outlives any single request without you storing an id.

            Scoped to your API key, so two tenants may both have a `build` and
            neither can name the other's. It frees when the sandbox stops.
          example: "build"
        get_or_create:
          type: boolean
          default: false
          description: |
            When `name` already belongs to one of your running sandboxes, return
            that sandbox instead of creating one — a 200 with the existing
            sandbox rather than a 201 with a new one. Without it, a duplicate
            `name` is refused with a 409.

            The existing sandbox is returned as it is: the other fields here are
            the shape a create *would* have used and are ignored when there is
            nothing to create. Requires `name`.
        vcpus: { type: integer, minimum: 1, default: 1 }
        mem_mib: { type: integer, minimum: 128, default: 256 }
        cpu_cores:
          type: number
          format: double
          description: A hard CPU ceiling; may be fractional. 0.5 means half a core, enforced.
          example: 0.5
        disk_mib: { type: integer }
        network_bps:
          type: integer
          description: |
            Caps bandwidth both ways, in bytes per second. Worth setting even
            when CPU is capped: a sandbox pinned to a quarter core can still
            saturate the host's uplink, and the first you hear of it is the
            abuse complaint.
        disk_bps: { type: integer }
        disk_iops: { type: integer }
        network:
          type: boolean
          default: false
          description: |
            Filtered egress. The public internet is reachable; every private
            range, link-local and the cloud metadata endpoint are not.
        env:
          type: object
          additionalProperties: { type: string }
          description: |
            Injected into every execution in this sandbox. An execution's own
            env wins where they overlap.

            Write-only. These usually carry credentials, so they are never
            logged and no endpoint returns them. They are applied by the host on
            each execution rather than written into the guest's filesystem,
            where anything inside could read them long after the command that
            needed them.
        tags:
          type: object
          additionalProperties: { type: string }
          maxProperties: 10
          description: |
            Labels of your own, for finding this sandbox again: filter
            `GET /sandboxes` by `tag`, or read them back off the object.

            At most 10 pairs, keys at most 64 bytes and values at most 256. Bytes
            rather than characters, so a key written in emoji runs out about four
            times sooner than its length suggests. A key may not be empty and may
            not contain `:`, which is the character the `tag` filter splits on.

            Node-local, like the list they are filtered on: they live in the
            daemon's memory beside the sandbox and go when it is forgotten. They
            are not written into the guest and nothing inside it can read them,
            which is what separates them from `env` -- a tag names a sandbox, it
            does not configure one.

            **Returned by the API, unlike `env`.** Anything that can read this
            sandbox can read its tags -- which is its own tenant, and an admin key
            -- so a tag is a label and never a secret.
          example: {"env": "ci", "owner": "billing-team"}
        ttl_seconds:
          type: integer
          default: 900
          description: |
            Maximum lifetime. The sandbox is killed when it elapses. Capped by
            the host's own maximum, and extensible later within that cap with
            `POST /sandboxes/{sandbox}/extend`.

            It is time to run things in, so seeding a `source` does not consume it:
            the clock starts once the project is in the guest. A `ttl_seconds`
            shorter than the seed takes is refused naming this field.
        idle_seconds:
          type: integer
          default: 120
          description: Reclaim after this long with nothing running. Negative disables it.
        storage:
          allOf: [{ $ref: '#/components/schemas/SandboxStorageParams' }]
          description: |
            Options for this sandbox's storage mount. The namespace is never set
            here — it comes from your API key. Only the read/write posture is
            yours to choose, and only to tighten.
        source:
          allOf: [{ $ref: '#/components/schemas/SandboxSourceParams' }]
          description: |
            A project to seed the sandbox with, fetched by the daemon before this
            create returns. Without it, getting a project in is one request per
            file, or a clone inside the guest -- which needs `network: true`, is
            impossible for a network-isolated sandbox, and puts your credential
            inside a VM that is untrusted by design.

            Off unless the operator enabled it. See `SandboxSourceParams`.

    SandboxStorageParams:
      type: object
      description: What a create request may say about storage, which is very little.
      properties:
        read_only:
          type: boolean
          description: |
            Mount storage read-only for this sandbox even if the key could write.
            It can only tighten: a read-only key stays read-only whatever you set
            here. Useful for a run that should read shared state but never touch it.
        mount_path:
          type: string
          description: |
            Where to mount storage inside the guest. An absolute, clean path using
            only letters, digits and `_-./`; it names a directory in your own
            sandbox and cannot reach another tenant's files. Defaults to
            `/mnt/storage`.
          example: "/data"

    SandboxSourceParams:
      type: object
      description: |
        Where to get the project this sandbox starts with.

        The daemon fetches it, expands it host-side, and writes the result into the
        guest's working directory over the same endpoints a file upload uses. It is
        done before the create returns and it counts as activity, so a slow seed
        cannot be reclaimed as idle halfway through.

        **Off unless the operator turned it on.** Fetching needs `-source-fetch`,
        and every host that may be fetched from must be named with
        `-source-allow-host`; either one missing refuses every `source` with
        `source_not_permitted`. An empty allowlist fetches nothing, so enabling the
        flag alone changes nothing. The gate is the point rather than paperwork:
        the daemon sits outside the firewall it installs for guests, so a URL it
        will fetch on request is a URL an operator has to have agreed to.

        Bounded by the operator too, with `-source-max-bytes` on what is
        downloaded, `-source-max-expanded-bytes` on what is written, and
        `-source-max-files` on how many members an archive may hold. Past any of
        them is `source_fetch_failed`.

        There is deliberately no destination field. The project lands in the
        guest's working directory -- where a relative path in a file upload lands --
        and a caller-chosen root would only be a way to write over the image's own
        `/usr` and `/etc` before anything in the sandbox runs.
      required: [type, url]
      properties:
        type:
          type: string
          description: |
            Which fetcher to use.

            The remaining fields are per-type: `strip_components` belongs to a
            tarball, and `ref`, `depth` and `credential_ref` to a git clone. One
            sent with the wrong type is an `invalid_request_error` naming the field,
            not a field quietly dropped -- a caller who set `ref` on a tarball meant
            something by it, and seeding the default branch instead would be the
            wrong project delivered silently.
          enum: [tarball, git]
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            What to fetch.

            `https` only. An `http` seed is a project any network attacker on the
            path gets to rewrite before it runs, and `file://`, `ftp://`,
            `gopher://` and git's own `ext::` -- which is a command, not a
            transport -- are refused by the same check. They name things on the
            host, and the host is the one place this URL must never reach.

            The host must be on the operator's `-source-allow-host` list, and so
            must every redirect hop: an allowlist checked once is an allowlist a
            302 walks around. Where the name resolves is re-checked at connect
            time on every hop, against the private, loopback, link-local and
            IPv4-mapped ranges the guest firewall already blocks -- so a name that
            resolves to `169.254.169.254`, or rebinds to it between the check and
            the connect, does not get a socket.

            Every one of those refusals is the same `source_not_permitted` with the
            same message. Distinguishing them would turn this field into a port
            scanner that reads the host's routing table.

            No credential in here. `credential_ref` is where one goes, and this
            value comes back on the sandbox with its userinfo and query removed
            precisely because callers put them here anyway.
          example: "https://github.com/acme/widgets/archive/refs/tags/v1.2.3.tar.gz"
        strip_components:
          type: integer
          minimum: 0
          maximum: 8
          default: 0
          description: |
            Leading path elements to drop from every member, like `tar
            --strip-components`. Tarball only.

            `1` is the usual value: a release tarball wraps everything in a single
            directory named after the version, and without this the project arrives
            one level deeper than every path inside it expects.

            A member with fewer elements than this is skipped rather than refused --
            a `LICENSE` sitting beside the wrapper directory is normal. An archive
            where every member is skipped is `source_fetch_failed`, because a
            sandbox seeded with nothing is not what was asked for and an empty
            working directory is the hardest kind of failure to debug later.
          example: 1
        ref:
          type: string
          maxLength: 255
          description: |
            Branch, tag or full commit SHA to check out. Git only. Defaults to the
            remote's default branch.

            Prefer a SHA. It is the only one of the three that resolves to the same
            code twice, and the sandbox reports back the commit it actually got.
          example: "main"
        depth:
          type: integer
          minimum: 1
          default: 1
          description: |
            How much history to fetch, in commits. Git only.

            Defaults to 1, because the sandbox needs a working tree and the commits
            behind it are bytes nothing in there will read. Raise it only when
            something you intend to run walks the history. The `.git` directory is
            not written into the guest either way.
          example: 1
        credential_ref:
          type: string
          maxLength: 128
          description: |
            The **name** of a credential the operator configured with
            `-source-credential`, for a private repository. Git only.

            Not the credential. A secret in a request body is a secret in an access
            log, in a proxy, and in whatever retried the request -- the same
            reasoning that made the storage namespace derive from your key instead
            of arriving in the body. A name the operator did not configure is
            `source_not_permitted`, like an unreachable URL, and for the same
            reason: the difference is the operator's business, not the caller's.

            The secret it names never enters the URL and never enters the guest. The
            clone happens on the host and only the working tree is copied in, so
            nothing in the sandbox can read the token that fetched it -- which is
            the whole reason this is not a clone inside the guest.
          example: "github-ci"

    SandboxExtendParams:
      type: object
      required: [ttl_seconds]
      properties:
        ttl_seconds:
          type: integer
          minimum: 1
          description: |
            How much longer the sandbox should live, counted from now rather than
            from its current deadline -- a heartbeat says "give me ten more
            minutes", and repeating it does not stack.

            What you get is the later of the existing deadline and this one. More
            than the host's maximum lifetime from creation still has left is
            refused, not trimmed. The reply's `expires` is the answer; this number
            is a request.
          example: 600

    # --- tenants (admin) ----------------------------------------------------

    TenantFullPolicy:
      type: string
      description: |
        What a write does when a tenant is at its cap.

        - `preserve` — reject the write and keep what is stored. For data that
          matters more than the next write: an audit trail, a paid-for dataset.
        - `evict` — delete the oldest objects until the write fits. For a cache
          or scratch space, where the newest data is the point. It deletes data,
          irreversibly, which is why it is never the default.
      enum: [preserve, evict]

    Tenant:
      type: object
      required: [object, id, max_bytes, policy]
      properties:
        object: { type: string, enum: [tenant] }
        id:
          type: string
          description: The tenant namespace this policy applies to.
          example: "t_9f86d081884c7d659a2feaa0c55ad015"
        max_bytes:
          type: integer
          format: int64
          description: The tenant's total storage cap, in bytes. 0 means unlimited.
        policy: { $ref: '#/components/schemas/TenantFullPolicy' }
        usage_bytes:
          type: integer
          format: int64
          description: |
            Bytes currently stored, read from the object store on retrieve. Absent
            on the reply to an update, which does not stop to scan the bucket.

    TenantList:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Tenant' }

    TenantUpdateParams:
      type: object
      required: [max_bytes, policy]
      properties:
        max_bytes:
          type: integer
          format: int64
          description: The tenant's total storage cap, in bytes. 0 means unlimited.
          example: 1073741824
        policy: { $ref: '#/components/schemas/TenantFullPolicy' }

    # --- execution ----------------------------------------------------------

    ExecutionStatus:
      type: string
      description: |
        Outcomes that all look like failure but are not, and a caller must tell
        apart:

        - `running` — still going.
        - `exited` — your code ran to completion. `exit_code` is its own verdict.
        - `timed_out` — it exceeded its timeout and we killed it.
        - `canceled` — you cancelled it.
        - `vanished` — **we took the VM away.** Your code did not fail.
        - `failed` — the command could never start, e.g. no such binary.
      enum: [running, exited, timed_out, canceled, vanished, failed]

    Execution:
      type: object
      required: [id, object, sandbox, cmd, status, created, stdout, stderr]
      properties:
        id: { type: string, example: "exe_01JZ8QK3M4N5P6R7S8T9V0W1X2" }
        object: { type: string, enum: [execution] }
        sandbox: { type: string, example: "sb_01JZ8QK3M4N5P6R7S8T9V0W1X2" }
        cmd: { type: string, example: "python3" }
        args:
          type: array
          items: { type: string }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        exit_code: { type: integer, nullable: true }
        signal:
          type: string
          nullable: true
          description: The signal that killed it, if one did.
          example: "SIGKILL"
        error:
          type: string
          description: Why the command could never start. Set only when status is `failed`.
        stdout: { type: string }
        stderr: { type: string }
        stdout_truncated:
          type: boolean
          description: |
            Output exceeded the retention cap and the oldest bytes were dropped.
            The *tail* is kept, because that is where a traceback is. Never
            silently truncated: a partial log that looks complete is worse than
            no log.
        stderr_truncated: { type: boolean }
        created: { type: string, format: date-time }
        finished: { type: string, nullable: true, format: date-time }
        duration_ms: { type: integer }

    ExecutionList:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Execution' }

    ExecutionCreateParams:
      type: object
      required: [cmd]
      properties:
        cmd: { type: string, example: "python3" }
        args:
          type: array
          items: { type: string }
          example: ["main.py"]
        env:
          type: object
          additionalProperties: { type: string }
          description: Merged over the sandbox's env; these win. Write-only.
        cwd: { type: string }
        stdin:
          type: string
          format: byte
          description: Written to the process, then closed.
        timeout_seconds:
          type: integer
          default: 300
          description: Kills the process group when exceeded.
        tty:
          type: boolean
          default: false
          description: |
            Run the command against a pseudo-terminal instead of pipes. The
            process sees an interactive terminal, so line editing, colour and
            programs that refuse to run without one all work.

            stdout and stderr are merged — a terminal has one output stream — so
            everything arrives on `stdout`. Resize the window with the resize
            route, and stream input through the stdin route as keystrokes.
        rows:
          type: integer
          minimum: 0
          maximum: 65535
          description: |
            Initial terminal height in rows, for a `tty` execution. Defaults to
            24 when omitted; ignored without `tty`.
          example: 24
        cols:
          type: integer
          minimum: 0
          maximum: 65535
          description: |
            Initial terminal width in columns, for a `tty` execution. Defaults to
            80 when omitted; ignored without `tty`.
          example: 80

    ExecutionResizeParams:
      type: object
      required: [rows, cols]
      properties:
        rows:
          type: integer
          minimum: 0
          maximum: 65535
          description: The new terminal height, in rows.
          example: 40
        cols:
          type: integer
          minimum: 0
          maximum: 65535
          description: The new terminal width, in columns.
          example: 120

    ExecutionCancelParams:
      type: object
      properties:
        signal:
          type: string
          default: SIGKILL
          description: The signal to send. It reaches the whole process group.
          example: "SIGKILL"

    # --- file ---------------------------------------------------------------

    File:
      type: object
      required: [object, path, size_bytes]
      properties:
        object: { type: string, enum: [file] }
        path: { type: string, example: "/app/main.py" }
        size_bytes: { type: integer }
        mode:
          type: string
          description: |
            The permission bits the file ended up with, octal. Set explicitly
            rather than left to whatever umask the guest happens to have, so this
            is what was asked for and not an approximation of it.
          example: "0644"

    FileCreateParams:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          description: Absolute path inside the sandbox. Parent directories are created.
          example: "/app/main.py"
        content:
          type: string
          format: byte
          description: The file's bytes, base64 encoded so binary survives the trip.
        mode:
          type: string
          pattern: '^0?[0-7]{3}$'
          default: "0644"
          description: |
            Permission bits, octal -- `0755` for something you intend to execute.
            Defaults to `0644`, so an upload is readable and not runnable unless
            you say otherwise.

            Three digits, with an optional leading zero. setuid, setgid and the
            sticky bit are refused with an `invalid_request_error` on `mode`: the
            host writes this file as root, and the one thing an upload must never
            be able to do is leave a root-owned setuid binary behind for whatever
            runs in the guest next. Code inside the sandbox can still chmod its
            own files -- then it is the guest's own doing, and stays inside the
            guest.
          example: "0755"

    FileBatchCreateParams:
      type: object
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 100
          description: |
            The files to write, in the order they will be written. An entry is
            exactly a single-file upload, so a path or mode this route refuses is
            one the single-file route refuses too -- there is one set of rules,
            not two.
          items: { $ref: '#/components/schemas/FileCreateParams' }

    FileList:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/File' }

    Directory:
      type: object
      description: |
        A directory in the sandbox. Deliberately not a `File`: a directory has no
        bytes, and a `size_bytes: 0` on one would be a number a caller could
        believe.
      required: [object, path]
      properties:
        object: { type: string, enum: [directory] }
        path: { type: string, example: "/app/out" }

    DirectoryCreateParams:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: |
            Absolute path inside the sandbox. Parents are created. Validated
            before it reaches the guest: a relative path, or one containing `..`,
            is refused rather than resolved into whatever it would have meant.
          example: "/app/out"

    # --- task ---------------------------------------------------------------

    TaskStatus:
      type: string
      description: |
        - `pending` — waiting for a slot anywhere in the fleet.
        - `running` — a node holds it.
        - `done` — it ran. `exit_code` is your code's own verdict, and a
          non-zero one is still `done`.
        - `failed` — **our** failure: no node could run it, after its attempts
          ran out.
      enum: [pending, running, done, failed]

    Task:
      type: object
      required: [id, object, status]
      properties:
        id: { type: string, example: "tsk_01JZ8QK3M4N5P6R7S8T9V0W1X2" }
        object: { type: string, enum: [task] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        exit_code: { type: integer, nullable: true }
        stdout: { type: string }
        stderr: { type: string }
        error:
          type: string
          description: |
            An infrastructure failure. Distinct from a non-zero exit, which is
            the caller's own code and not a failure of ours.
        attempts:
          type: integer
          description: |
            How many tries it took. Retries are for nodes dying, not for code
            failing: a task whose process exits non-zero is never retried, or a
            caller's bug would be run repeatedly and billed for each attempt.
        created: { type: string, format: date-time }
        started: { type: string, nullable: true, format: date-time }
        finished: { type: string, nullable: true, format: date-time }
        active_cpu_ms: { type: integer }
        memory_peak_bytes: { type: integer }

    TaskCreateParams:
      type: object
      required: [image, cmd]
      properties:
        image: { type: string, example: "python" }
        cmd: { type: string, example: "python3" }
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
          description: Write-only.
        files:
          type: object
          additionalProperties:
            type: string
            format: byte
          description: Written into the sandbox before the command runs, keyed by path.
          example: {"/app/main.py": "cHJpbnQoImhpIik="}
        timeout_seconds: { type: integer, default: 300 }
        network: { type: boolean, default: false }
        vcpus: { type: integer, default: 1 }
        mem_mib: { type: integer, default: 256 }
        cpu_cores: { type: number, format: double }
        priority:
          type: integer
          minimum: 0
          maximum: 10
          default: 0
          description: |
            Scheduling priority, 0 to 10. Higher runs first; equal priorities are
            FIFO, which is the guarantee callers actually reason about. It orders
            the queue within what a node can fit: among the tasks a node has room
            for, the highest priority is taken first, so a high-priority task that
            does not fit yields to a lower one that does rather than blocking it.
        max_attempts:
          type: integer
          default: 2
          description: |
            How many times a node may try this before it is failed for good. Two
            means one retry: enough to survive a node dying, few enough that a
            task which reliably kills its worker cannot cycle the fleet forever.

    # --- queue, images, health ----------------------------------------------

    Queue:
      type: object
      required: [object, pending, leased, done, failed, oldest_pending_ms, slots, busy]
      properties:
        object: { type: string, enum: [queue] }
        pending: { type: integer }
        leased:
          type: integer
          description: Held by a worker somewhere in the fleet.
        done: { type: integer }
        failed: { type: integer }
        oldest_pending_ms:
          type: integer
          description: |
            How long the head of the queue has waited. This is the number that
            says whether the fleet is big enough.
        slots:
          type: integer
          description: This node's slots. Not the fleet's.
        busy:
          type: integer
          description: This node's slots currently running something.

    Image:
      type: object
      required: [object, id, language]
      properties:
        object: { type: string, enum: [image] }
        id: { type: string, example: "python" }
        language: { type: string, example: "python" }
        arch: { type: string, example: "arm64" }
        size_bytes: { type: integer }

    ImageList:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Image' }

    Health:
      type: object
      required: [object, ok, version]
      properties:
        object: { type: string, enum: [health] }
        ok: { type: boolean }
        version: { type: string }

    # --- streaming ----------------------------------------------------------

    Frame:
      type: object
      description: One event in an execution's stream, sent as an SSE data payload.
      required: [object, type]
      properties:
        object: { type: string, enum: [frame] }
        type:
          type: string
          enum: [started, stdout, stderr, exit, error]
        data:
          type: string
          format: byte
          description: The chunk, base64 so binary output survives the trip.
        pid: { type: integer }
        exit_code: { type: integer, nullable: true }
        signal: { type: string }
        timed_out: { type: boolean }
        message: { type: string }
